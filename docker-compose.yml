services:
  web:
    image: tipan:1.0.0
    container_name: app_tipan
    ports:
      - "8580:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=tipan_db
      - DB_USER=tipan_user
      - DB_PASSWORD=123456
    networks:
      - h_tipan
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: db_tipan
    environment:
      - POSTGRES_DB=tipan_db
      - POSTGRES_USER=tipan_user
      - POSTGRES_PASSWORD=123456
    volumes:
      - v_tipan:/var/lib/postgresql/data
    networks:
      - h_tipan

volumes:
  v_tipan:

networks:
  h_tipan:
